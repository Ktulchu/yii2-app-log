name: Publish yii2-app-log v0.3.0

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.3.0 for tested release commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REF_NAME: main
          TAG: v0.3.0
        run: |
          set -euo pipefail
          subject="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '.commit.message | split("\n")[0]')"
          if [[ "$subject" != "release: v0.3.0" ]]; then
            echo "Not the intended release commit; skipping."
            exit 0
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$REF_NAME" --jq '.object.sha')"
          if [[ "$main_sha" != "$SHA" ]]; then
            echo "Release SHA is not current main HEAD, refusing" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; no change."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag exists without release, refusing to retarget" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "v0.3.0 — Audit source attribution" \
            --notes "New nullable source_type on audit history; automatic console:<route> detection, explicit queue:<job> override, optional user IDs unchanged. Additive migration m261118_000004_add_app_log_source_type must be applied before deploying the updated behavior. Existing records keep NULL. All PHP 8.1/8.3/8.4 PostgreSQL CI and independent Composer smoke tests pass."
